<!DOCTYPE html>
<html lang="hr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie aplikacija</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <style>
            .card-img-top {height: 300px; object-fit: cover;}
            .film-kartica {transition: transform 0.2s;}
            .film-kartica:hover{transform: scale(1.02);}
        </style>
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand">Moja app</span>
                <button class="btn btn-outline-warning" onclick="ucitajFavorite()">Moji Favoriti</button>
            </div>
        </nav>

        <div class="container">
            <div class="row mb-4">
                <div class="col-md-8 position-relative">
                    <input type="text" id="upit" class="form-control" placeholder="Upiši naziv filma" autocomplete="off" oninput="autocompleteFilmove()">
                    <div id="autocomplete-lista" class="list-group position-absolute w-100 shadow-lg start-0 top-100 mt-1" style="z-index: 1000; max-height: 320px; overflow-y: auto;"></div>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn btn-primary w-100" onclick="pretraziFilmove()">Pronađi film</button>
                </div>
            </div>
            <div id="rezultati" class="row"></div>
            <script src="klijent.js"></script>
        </div>
    </body>
</html>
